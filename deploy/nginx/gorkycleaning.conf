# Отдельный server block — не трогает другие сайты на этом VPS.
# Установка:
#   sudo cp deploy/nginx/gorkycleaning.conf /etc/nginx/sites-available/gorkycleaning
#   sudo ln -sf /etc/nginx/sites-available/gorkycleaning /etc/nginx/sites-enabled/gorkycleaning
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gorkycleaning.ru -d www.gorkycleaning.ru

server {
    listen 80;
    listen [::]:80;
    server_name gorkycleaning.ru www.gorkycleaning.ru;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
